<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-label="Browser teachable classifier">
  <defs>
    <linearGradient id="g" x1="64" y1="96" x2="448" y2="416" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d3d1a"/>
      <stop offset="1" stop-color="#061a0c"/>
    </linearGradient>
    <linearGradient id="stroke" x1="120" y1="200" x2="392" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="48" fill="url(#g)"/>
  <rect x="40" y="56" width="432" height="320" rx="20" fill="#0f172a" stroke="url(#stroke)" stroke-width="2" opacity="0.95"/>
  <rect x="40" y="56" width="432" height="44" rx="12" fill="#111827"/>
  <circle cx="72" cy="78" r="8" fill="#ef4444"/>
  <circle cx="96" cy="78" r="8" fill="#f59e0b"/>
  <circle cx="120" cy="78" r="8" fill="#22c55e"/>
  <rect x="168" y="68" width="240" height="20" rx="6" fill="#1f2937"/>
  <!-- camera / capture -->
  <rect x="176" y="140" width="160" height="120" rx="12" fill="#052e16" stroke="#4ade80" stroke-opacity="0.5"/>
  <circle cx="256" cy="200" r="44" fill="#022c12" stroke="#86efac" stroke-width="3"/>
  <circle cx="256" cy="200" r="28" fill="#14532d"/>
  <!-- class outputs -->
  <rect x="96" y="296" width="96" height="56" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="208" y="296" width="96" height="56" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <rect x="320" y="296" width="96" height="56" rx="10" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
  <text x="144" y="332" text-anchor="middle" fill="#bbf7d0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">A</text>
  <text x="256" y="332" text-anchor="middle" fill="#bbf7d0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">B</text>
  <text x="368" y="332" text-anchor="middle" fill="#bbf7d0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600">C</text>
  <!-- kNN hint: paths from capture to buckets -->
  <path d="M220 252 L132 296" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" filter="url(#s)"/>
  <path d="M256 256 L256 296" stroke="#34d399" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M292 252 L380 296" stroke="#34d399" stroke-width="2" stroke-opacity="0.5" filter="url(#s)"/>
  <text x="256" y="404" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" letter-spacing="0.08em" opacity="0.85">ON-DEVICE CLASSIFIER</text>
</svg>
