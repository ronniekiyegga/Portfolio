<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-label="BYOK request routing through user-supplied keys">

  <text x="400" y="40" text-anchor="middle" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Bring Your Own Key</text>
  <text x="400" y="64" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="13">User keys never touch application logs</text>

  <!-- Client -->
  <g transform="translate(72 188)">
    <rect x="0" y="0" width="128" height="88" rx="10" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="16" y="16" width="96" height="56" rx="6" fill="#F3F4F6"/>
    <rect x="24" y="24" width="80" height="40" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="64" y="112" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Client</text>
  </g>

  <!-- Application boundary -->
  <g transform="translate(272 156)">
    <rect x="0" y="0" width="256" height="152" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="128" y="26" text-anchor="middle" fill="#6366F1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Application boundary</text>
    <rect x="32" y="44" width="192" height="44" rx="8" fill="#EDE9FE" stroke="#DDD6FE" stroke-width="1"/>
    <text x="128" y="71" text-anchor="middle" fill="#374151" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Key vault + rate limits</text>
    <rect x="32" y="98" width="192" height="40" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="128" y="123" text-anchor="middle" fill="#4338CA" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Provider router</text>
  </g>

  <!-- Providers -->
  <g transform="translate(600 176)">
    <rect x="0" y="0" width="112" height="48" rx="10" fill="#374151" stroke="#1F2937" stroke-width="1"/>
    <text x="56" y="30" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">OpenAI</text>
    <rect x="0" y="64" width="112" height="48" rx="10" fill="#6366F1" stroke="#4F46E5" stroke-width="1"/>
    <text x="56" y="94" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Gemini</text>
  </g>

  <!-- Arrows -->
  <path d="M200 232 H272" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow-dark)"/>
  <text x="236" y="222" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="11">Request</text>
  <path d="M528 200 H600" stroke="#6366F1" stroke-width="1.75" marker-end="url(#arrow-indigo)"/>
  <path d="M528 248 H600" stroke="#6366F1" stroke-width="1.75" marker-end="url(#arrow-indigo)"/>

  <defs>
    <marker id="arrow-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#6366F1"/>
    </marker>
  </defs>
</svg>
