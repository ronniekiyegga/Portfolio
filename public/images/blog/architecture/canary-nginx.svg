<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-label="Canary deployment with Nginx weighted upstreams">

  <text x="400" y="40" text-anchor="middle" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Canary deployment</text>
  <text x="400" y="64" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="13">Weighted upstreams on a single VPS</text>

  <!-- Users -->
  <g transform="translate(64 196)">
    <circle cx="44" cy="44" r="40" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <circle cx="44" cy="30" r="10" fill="#EDE9FE" stroke="#C4B5FD"/>
    <path d="M24 58 C24 46 32 42 44 42 C56 42 64 46 64 58" fill="#EDE9FE" stroke="#C4B5FD"/>
    <text x="44" y="104" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Users</text>
  </g>

  <!-- Nginx -->
  <g transform="translate(280 168)">
    <rect x="0" y="0" width="200" height="104" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="100" y="44" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Nginx</text>
    <text x="100" y="68" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="12">Health checks + rollback</text>
  </g>

  <!-- Stable -->
  <g transform="translate(584 152)">
    <rect x="0" y="0" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#34D399" stroke-width="1.5"/>
    <text x="66" y="36" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Stable</text>
    <text x="66" y="58" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">90%</text>
  </g>

  <!-- Canary -->
  <g transform="translate(584 252)">
    <rect x="0" y="0" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <text x="66" y="36" text-anchor="middle" fill="#4F46E5" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Canary</text>
    <text x="66" y="58" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="13">10%</text>
  </g>

  <!-- Arrows -->
  <path d="M152 240 H280" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow-dark)"/>
  <text x="216" y="228" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="11">Traffic</text>
  <path d="M480 204 H584" stroke="#059669" stroke-width="1.75" marker-end="url(#arrow-green)"/>
  <text x="532" y="194" text-anchor="middle" fill="#059669" font-family="system-ui, sans-serif" font-size="11">90%</text>
  <path d="M480 290 H584" stroke="#6366F1" stroke-width="1.75" marker-end="url(#arrow-indigo)"/>
  <text x="532" y="304" text-anchor="middle" fill="#6366F1" font-family="system-ui, sans-serif" font-size="11">10%</text>

  <defs>
    <marker id="arrow-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#6366F1"/>
    </marker>
  </defs>
</svg>
