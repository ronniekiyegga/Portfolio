<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-label="PostgreSQL operational data and BigQuery analytical workloads">
  <rect width="800" height="480" fill="#FAFAFA"/>

  <text x="400" y="40" text-anchor="middle" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Operational vs analytical data</text>
  <text x="400" y="64" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="13">OLTP writes separated from OLAP reporting</text>

  <!-- Application -->
  <g transform="translate(320 108)">
    <rect x="0" y="0" width="160" height="64" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="80" y="40" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Application</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(96 248)">
    <ellipse cx="72" cy="22" rx="72" ry="18" fill="#336791"/>
    <rect x="0" y="22" width="144" height="72" rx="4" fill="#4A90B8" stroke="#336791" stroke-width="1"/>
    <ellipse cx="72" cy="94" rx="72" ry="14" fill="#336791"/>
    <text x="72" y="68" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">PostgreSQL</text>
    <text x="72" y="128" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Operational writes</text>
  </g>

  <!-- BigQuery -->
  <g transform="translate(560 248)">
    <ellipse cx="72" cy="22" rx="72" ry="18" fill="#4285F4"/>
    <rect x="0" y="22" width="144" height="72" rx="4" fill="#669DF6" stroke="#4285F4" stroke-width="1"/>
    <ellipse cx="72" cy="94" rx="72" ry="14" fill="#4285F4"/>
    <text x="72" y="68" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600">BigQuery</text>
    <text x="72" y="128" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Reporting reads</text>
  </g>

  <!-- Arrows -->
  <path d="M360 172 V196 H168 V248" stroke="#336791" stroke-width="1.75" fill="none" marker-end="url(#arrow-pg)"/>
  <text x="228" y="208" fill="#336791" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Writes</text>
  <path d="M440 172 V196 H632 V248" stroke="#4285F4" stroke-width="1.75" fill="none" marker-end="url(#arrow-bq)"/>
  <text x="572" y="208" fill="#4285F4" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Analytics</text>

  <!-- ETL -->
  <g transform="translate(240 368)">
    <rect x="0" y="0" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <path d="M32 20 H288" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
    <text x="160" y="26" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="12">Async sync / ETL</text>
  </g>
  <path d="M168 344 V368" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M632 344 V368" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 4"/>

  <defs>
    <marker id="arrow-pg" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#336791"/>
    </marker>
    <marker id="arrow-bq" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#4285F4"/>
    </marker>
    <marker id="arrow-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#9CA3AF"/>
    </marker>
  </defs>
</svg>
