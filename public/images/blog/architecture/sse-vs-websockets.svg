<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none" role="img" aria-label="SSE one-way push versus WebSocket bidirectional communication">

  <text x="400" y="40" text-anchor="middle" fill="#111827" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">SSE vs WebSockets</text>
  <text x="400" y="64" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif" font-size="13">One-way HTTP push versus persistent bidirectional channel</text>

  <line x1="400" y1="88" x2="400" y2="420" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- SSE panel -->
  <g transform="translate(40 96)">
    <rect x="0" y="0" width="320" height="324" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="160" y="32" text-anchor="middle" fill="#6366F1" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Server-Sent Events</text>

    <!-- Server -->
    <g transform="translate(48 108)">
      <rect x="18" y="68" width="76" height="5" rx="1" fill="#D1D5DB"/>
      <rect x="22" y="14" width="20" height="52" rx="3" fill="#94A3B8"/>
      <rect x="38" y="6" width="24" height="60" rx="3" fill="#64748B"/>
      <rect x="58" y="14" width="20" height="52" rx="3" fill="#94A3B8"/>
      <rect x="44" y="18" width="12" height="2.5" rx="0.5" fill="#93C5FD"/>
      <rect x="44" y="26" width="12" height="2.5" rx="0.5" fill="#CBD5E1"/>
      <rect x="44" y="34" width="12" height="2.5" rx="0.5" fill="#93C5FD"/>
      <circle cx="50" cy="54" r="2" fill="#34D399"/>
      <text x="56" y="96" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Server</text>
    </g>

    <!-- Client -->
    <g transform="translate(196 108)">
      <rect x="28" y="8" width="68" height="44" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/>
      <rect x="36" y="16" width="52" height="28" rx="2" fill="#FFFFFF"/>
      <rect x="50" y="52" width="24" height="6" rx="1" fill="#D1D5DB"/>
      <rect x="6" y="26" width="16" height="28" rx="3" fill="#FCA5A5" stroke="#F87171"/>
      <rect x="92" y="30" width="20" height="26" rx="3" fill="#7DD3FC" stroke="#38BDF8"/>
      <text x="64" y="96" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Client</text>
    </g>

    <!-- Flow -->
    <path d="M248 168 H152" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow-dark)"/>
    <text x="200" y="158" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="11">Connect</text>
    <path d="M152 196 H248" stroke="#6366F1" stroke-width="1.75" marker-end="url(#arrow-indigo)"/>
    <text x="200" y="186" text-anchor="middle" fill="#6366F1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Events</text>
    <path d="M152 218 H248" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-indigo)"/>
    <path d="M152 240 H248" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-indigo)"/>
  </g>

  <!-- WebSocket panel -->
  <g transform="translate(440 96)">
    <rect x="0" y="0" width="320" height="324" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="160" y="32" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">WebSockets</text>

    <!-- Server -->
    <g transform="translate(48 108)">
      <rect x="18" y="68" width="76" height="5" rx="1" fill="#D1D5DB"/>
      <rect x="22" y="14" width="20" height="52" rx="3" fill="#94A3B8"/>
      <rect x="38" y="6" width="24" height="60" rx="3" fill="#64748B"/>
      <rect x="58" y="14" width="20" height="52" rx="3" fill="#94A3B8"/>
      <rect x="44" y="18" width="12" height="2.5" rx="0.5" fill="#93C5FD"/>
      <rect x="44" y="26" width="12" height="2.5" rx="0.5" fill="#CBD5E1"/>
      <circle cx="50" cy="54" r="2" fill="#34D399"/>
      <text x="56" y="96" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Server</text>
    </g>

    <!-- Client -->
    <g transform="translate(196 108)">
      <rect x="28" y="8" width="68" height="44" rx="4" fill="#F3F4F6" stroke="#D1D5DB"/>
      <rect x="36" y="16" width="52" height="28" rx="2" fill="#FFFFFF"/>
      <rect x="50" y="52" width="24" height="6" rx="1" fill="#D1D5DB"/>
      <rect x="6" y="26" width="16" height="28" rx="3" fill="#FCA5A5" stroke="#F87171"/>
      <rect x="92" y="30" width="20" height="26" rx="3" fill="#7DD3FC" stroke="#38BDF8"/>
      <text x="64" y="96" text-anchor="middle" fill="#111827" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Client</text>
    </g>

    <!-- Flow -->
    <path d="M248 160 H152" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow-dark)"/>
    <text x="200" y="150" text-anchor="middle" fill="#6B7280" font-family="system-ui, sans-serif" font-size="11">Handshake</text>
    <path d="M152 180 H248" stroke="#374151" stroke-width="1.75" marker-end="url(#arrow-dark)"/>
    <rect x="128" y="204" width="144" height="32" rx="16" fill="#F3F4F6" stroke="#E5E7EB"/>
    <path d="M144 220 H256" stroke="#374151" stroke-width="2.5" marker-start="url(#arrow-both)" marker-end="url(#arrow-both)"/>
    <text x="200" y="256" text-anchor="middle" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Full duplex</text>
  </g>

  <defs>
    <marker id="arrow-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#374151"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#6366F1"/>
    </marker>
    <marker id="arrow-both" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <path d="M0 3.5 L7 0 L7 7 Z" fill="#374151"/>
    </marker>
  </defs>
</svg>
